---
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — GrainForge{% else %}GrainForge — Digitalize Film on macOS{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: 'GrainForge' }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="nav" role="banner">
    <div class="nav__inner">
      <a href="{{ '/' | relative_url }}" class="nav__logo">GrainForge</a>
      <nav aria-label="Site navigation">
        <a href="https://docs.grainforge.de" class="nav__link">Documentation</a>
        
        <a href="{{ '/imprint/' | relative_url }}" class="nav__link">Imprint</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="footer" role="contentinfo">
    <div class="footer__inner">
      <p class="footer__copy">&copy; {{ 'now' | date: '%Y' }} Benedict Weichselbaum</p>
      <nav class="footer__links" aria-label="Footer navigation">
        <a href="https://docs.grainforge.de/privacy_policy.html" class="footer__link">Privacy Policy</a>
        <a href="{{ '/imprint/' | relative_url }}" class="footer__link">Imprint</a>
        <a href="https://docs.grainforge.de" class="footer__link">Documentation</a>
      </nav>
    </div>
  </footer>

</body>
</html>
